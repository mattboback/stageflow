default_install_hook_types:
  - pre-commit
  - commit-msg

# Paths whose bytes are asserted elsewhere and must never be "tidied":
#   docs/reference/          generated by `stageflow docs`, byte-compared by
#                            devtools/scripts/check-cli-docs-generated.sh
#   qa/fixtures/, testdata/  golden files compared byte-for-byte by tests
exclude: ^(docs/reference/|qa/fixtures/|.*/testdata/|libs/contracts/[^/]+/generated/)

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        exclude: ^(helm/templates/|skaffold/|k8s/).*\.ya?ml$
      # tsconfig files are JSONC: the app/node variants carry comments, so the
      # strict JSON parser cannot read them. Anchored on the tsconfig prefix so
      # tsconfig.app.json and tsconfig.node.json are covered too.
      - id: check-json
        exclude: (^|/)tsconfig(\.[^.]+)?\.json$
      - id: check-added-large-files
        args: ['--maxkb=1000']
      - id: check-merge-conflict
      - id: detect-private-key

  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.3.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.22.1
    hooks:
      - id: gitleaks

  - repo: local
    hooks:
      - id: stageflow-markdown-links
        name: stageflow-markdown-links
        entry: node devtools/scripts/check-markdown-links.mjs
        language: system
        files: "\\.md$"
        pass_filenames: false
      - id: stageflow-precommit
        name: stageflow-precommit
        entry: node devtools/scripts/precommit/run.mjs
        language: system
        files: ^libs/contracts/(report|provenance|scanner-manifest|events)/
        require_serial: true

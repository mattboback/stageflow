name: StageFlow regression summary
description: Scan a deployed site and compare a reviewed JSON baseline in the GitHub step summary.
inputs:
  baseline:
    description: Path to a complete StageFlow JSON scan envelope used as the baseline.
    required: true
  target:
    description: Public preview URL to scan. Self-hosted APIs may also accept a built directory or ZIP.
    required: true
  profile:
    description: Scan assessment profile (production or staging). Use staging for preview deployments.
    required: false
    default: production
runs:
  using: composite
  steps:
    - uses: actions/setup-go@v7
      with:
        go-version-file: ${{ github.action_path }}/go.mod
        cache: false
    - name: Scan and compare
      shell: bash
      env:
        STAGEFLOW_BASELINE: ${{ inputs.baseline }}
        STAGEFLOW_TARGET: ${{ inputs.target }}
        STAGEFLOW_PROFILE: ${{ inputs.profile }}
      run: |
        set -euo pipefail
        cli="$(mktemp "$RUNNER_TEMP/stageflow-cli.XXXXXX")"
        current="$(mktemp "$RUNNER_TEMP/stageflow-current.XXXXXX.json")"
        trap 'rm -f "$cli" "$current"' EXIT
        go build -C "$GITHUB_ACTION_PATH" -o "$cli" ./clients/cli/cmd/stageflow
        scan_status=0
        "$cli" scan "$STAGEFLOW_TARGET" --profile "$STAGEFLOW_PROFILE" --format json --max-issues 0 > "$current" || scan_status=$?
        if [[ ! -s "$current" ]]; then
          printf '## StageFlow\n\nScan failed before a report was available. See the step logs.\n' >> "$GITHUB_STEP_SUMMARY"
          if (( scan_status == 0 )); then scan_status=2; fi
          exit "$scan_status"
        fi
        "$cli" diff "$STAGEFLOW_BASELINE" "$current" --fail-on-new=any --format markdown >> "$GITHUB_STEP_SUMMARY"

name: Golden Regression

on:
  workflow_dispatch:
  schedule:
    - cron: "23 8 * * *"

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name || github.run_id }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.26.3"
  NODE_VERSION: "22"
  BUN_VERSION: "1.3.8"

jobs:
  golden:
    name: Golden Baseline Promote Diff
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: "**/*.sum"

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install Podman
        run: |
          sudo apt-get update
          sudo apt-get install -y podman

      - name: Prepare dependencies
        run: |
          go work sync
          (cd clients/web && bun install --frozen-lockfile)
          (cd services/scanner-runner && PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD=1 bun install --frozen-lockfile)

      - name: Prepare environment
        run: |
          cp .env.example .env
          {
            printf 'ORCHESTRATOR_API_TOKEN=ci-orchestrator-token\n'
            printf 'PLATFORM_API_TOKEN=ci-platform-api-token\n'
          } >> .env

      - name: Build stageflow CLI
        run: |
          go build -o /tmp/stageflow ./clients/cli
          sudo install -m 0755 /tmp/stageflow /usr/local/bin/stageflow

      - name: Build container images
        run: ./infra/scripts/build-images.sh

      - name: Start stack
        run: |
          podman network inspect stageflow_net >/dev/null 2>&1 || podman network create stageflow_net
          podman compose -p stageflow \
            -f infra/compose/podman-compose.yml \
            -f infra/compose/podman-compose.local.yml \
            --env-file .env up -d

      - name: Wait for stack
        run: |
          for url in \
            http://127.0.0.1:9000/minio/health/live \
            http://127.0.0.1:8080/healthz \
            http://127.0.0.1:3010/
          do
            echo "Waiting for ${url}"
            for _ in {1..60}; do
              if curl -fsS "${url}" >/dev/null; then
                break
              fi
              sleep 2
            done
            curl -fsS "${url}" >/dev/null
          done

      - name: Initialize MinIO buckets
        run: |
          set -a
          source .env
          set +a
          MINIO_ENDPOINT=http://127.0.0.1:9000 ./infra/minio/init-buckets.sh

      - name: Run golden regression script
        run: bash qa/e2e/project-scan-golden.sh
        env:
          PROJECT_GOLDEN_ARTIFACT_DIR: artifacts/project-golden
          STAGEFLOW_API_KEY: ci-platform-api-token

      - name: Capture stack logs
        if: failure()
        run: |
          mkdir -p artifacts/project-golden
          podman compose -p stageflow \
            -f infra/compose/podman-compose.yml \
            -f infra/compose/podman-compose.local.yml \
            --env-file .env logs --no-color > artifacts/project-golden/compose.log || true

      - name: Upload golden artifacts
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: golden-regression-artifacts
          path: artifacts/project-golden
          if-no-files-found: ignore
          retention-days: 7

      - name: Stop stack
        if: always()
        run: |
          podman compose -p stageflow \
            -f infra/compose/podman-compose.yml \
            -f infra/compose/podman-compose.local.yml \
            --env-file .env down

name: Golden Regression

on:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name || github.run_id }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.26.2"
  BUN_VERSION: "1.3.8"

jobs:
  golden:
    name: Golden Baseline Promote Diff
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: "**/*.sum"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install Podman
        run: |
          sudo apt-get update
          sudo apt-get install -y podman

      - name: Prepare dependencies
        run: |
          go work sync
          (cd clients/web && bun install --frozen-lockfile)
          (cd services/scanner-runner && PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD=1 bun install --frozen-lockfile)

      - name: Prepare environment
        env:
          ORCHESTRATOR_API_TOKEN: ${{ secrets.GOLDEN_REGRESSION_TOKEN }}
        run: |
          cp .env.example .env
          test -n "$ORCHESTRATOR_API_TOKEN"
          printf 'ORCHESTRATOR_API_TOKEN=%s\n' "$ORCHESTRATOR_API_TOKEN" >> .env

      - name: Build stageflow CLI
        run: |
          go build -o /tmp/stageflow ./clients/cli
          sudo install -m 0755 /tmp/stageflow /usr/local/bin/stageflow

      - name: Build container images
        run: ./infra/scripts/build-images.sh

      - name: Start stack
        run: |
          podman network inspect stageflow_net >/dev/null 2>&1 || podman network create stageflow_net
          podman compose -p stageflow \
            -f infra/compose/podman-compose.yml \
            -f infra/compose/podman-compose.local.yml \
            --env-file .env up -d

      - name: Initialize MinIO buckets
        run: |
          set -a
          source .env
          set +a
          MINIO_ENDPOINT=http://127.0.0.1:9000 ./infra/minio/init-buckets.sh

      - name: Run golden regression script
        run: bash qa/e2e/project-scan-golden.sh

      - name: Stop stack
        if: always()
        run: |
          podman compose -p stageflow \
            -f infra/compose/podman-compose.yml \
            -f infra/compose/podman-compose.local.yml \
            --env-file .env down

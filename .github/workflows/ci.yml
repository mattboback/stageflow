name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Keeps the README's CI badge meaningful between merges: a green badge should
  # mean "green against today's toolchain and dependency graph", not "green on
  # whatever day main last moved". Offset from the golden-regression cron so the
  # two suites do not contend for runners.
  schedule:
    - cron: '41 7 * * *'
  workflow_dispatch: {}

permissions:
  contents: read
  pull-requests: read

defaults:
  run:
    shell: bash

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: '1.26.5'
  NODE_VERSION: '24'
  BUN_VERSION: '1.3.8'
  JUST_VERSION: '1.55.1'
  GOLANGCI_LINT_VERSION: 'v2.12.2'
  GOVULNCHECK_VERSION: 'v1.1.4'

jobs:
  workflow_lint:
    name: Workflow Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false

      - name: Verify shellcheck
        run: command -v shellcheck

      - name: Install actionlint
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Lint workflows
        run: actionlint -color -shellcheck="$(command -v shellcheck)"

      - name: Test Caddy credential boundary
        run: PODMAN=docker ./infra/caddy/capture_test.sh

      - name: Check stale vocabulary
        run: ./devtools/scripts/check-stale-vocab.sh

      - name: Check Dependabot package coverage
        run: ./devtools/scripts/check-dependabot-coverage.sh

      # Installing the hooks locally is optional (see CONTRIBUTING.md), so run the
      # same config here. Without this, .pre-commit-config.yaml gates nothing for
      # anyone who has not opted in, and drift in it goes unnoticed. This also
      # covers the Markdown link check, which is why there is no separate step for
      # it. The dedicated gitleaks job is still separate: it scans full history
      # with fetch-depth 0, which the hook does not.
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      # stageflow-precommit is skipped here, not disabled. It is a `language: system`
      # hook that regenerates the contract packages, so it needs those workspaces
      # bootstrapped -- installing them in this job just to re-run a check the `go`
      # job already performs (`bun run build` = generate -> validate:fixtures -> tsc,
      # for all three packages) would duplicate the work and the wall-clock. Every
      # other hook runs.
      - name: Run pre-commit hooks
        uses: pre-commit/action@2c7b3805fd2a0fd8c1884dcaebf91fc102a13ecd # v3.0.1
        env:
          SKIP: stageflow-precommit

  secrets_scan:
    name: Secrets (gitleaks)
    runs-on: ubuntu-latest
    needs: workflow_lint
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  go:
    name: Go (build, lint, test, vuln)
    runs-on: ubuntu-latest
    needs: workflow_lint
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: '**/*.sum'

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install tools
        run: |
          go install "github.com/golangci/golangci-lint/v2/cmd/golangci-lint@${GOLANGCI_LINT_VERSION}"
          go install "golang.org/x/vuln/cmd/govulncheck@${GOVULNCHECK_VERSION}"
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Validate event contract fixtures
        run: bun install --frozen-lockfile && bun run validate:fixtures
        working-directory: libs/contracts/events

      - name: Generate schema contracts
        run: ./devtools/scripts/generate-contracts.sh

      # `build` runs generate -> validate:fixtures -> tsc, so this is the contract
      # drift and fixture-validity gate. provenance was missing from the loop, which
      # left its four auth fixtures unvalidated anywhere in CI.
      - name: Verify TypeScript contract packages
        run: |
          for dir in libs/contracts/report libs/contracts/provenance libs/contracts/scanner-manifest; do
            (cd "$dir" && bun install --frozen-lockfile && bun run build && bun run typecheck)
          done

      - name: Go build
        run: bash devtools/scripts/go/run-in-work-dirs.sh Building go build ./...

      - name: Go lint
        run: bash devtools/scripts/go/run-in-work-dirs.sh Linting golangci-lint run

      - name: Go test
        run: bash devtools/scripts/go/run-in-work-dirs.sh Testing go test -race ./...

      - name: CLI docs stay generated
        run: ./devtools/scripts/check-cli-docs-generated.sh

      # Resolves `just` from a baked-in download manifest rather than querying the
      # casey/just releases API at runtime. The previous action did the latter and
      # intermittently failed with "no release for just matching version specifier"
      # on a version that is in fact published, reddening unrelated PRs.
      - name: Setup just
        uses: taiki-e/install-action@7572810d7dd469b651bb7793945692cf78da5dd7 # v2.85.0
        with:
          tool: just@${{ env.JUST_VERSION }}

      - name: Shell regression tests
        run: just shell-tests

      - name: Go vulncheck
        run: bash devtools/scripts/go/run-in-work-dirs.sh Vulncheck govulncheck ./...

  clients_web:
    name: Web App (audit, lint, typecheck, test, build, e2e)
    runs-on: ubuntu-latest
    needs: workflow_lint
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: '**/*.sum'

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Generate schema contracts
        run: ./devtools/scripts/generate-contracts.sh

      - name: Install
        run: bun install --frozen-lockfile
        working-directory: clients/web

      - name: Audit (high)
        run: bun audit --audit-level=high
        working-directory: clients/web

      # Invokes the package's own `ci` script rather than restating its steps, so
      # the workflow and `just ci` cannot drift from what a contributor runs
      # locally. This mirrors how the scanner-runner job is wired below.
      - name: CI (lint, typecheck, test, build)
        run: bun run ci
        working-directory: clients/web

      - name: Install Playwright browser
        run: bunx playwright install --with-deps chromium
        working-directory: clients/web

      - name: E2E smoke (preview build, mocked API)
        run: bun run test:e2e
        working-directory: clients/web

  scanner-runner:
    name: Scanner Runner (lint, typecheck, test)
    runs-on: ubuntu-latest
    needs: workflow_lint
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: '**/*.sum'

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Generate schema contracts
        run: ./devtools/scripts/generate-contracts.sh

      - name: Install
        run: bun install --frozen-lockfile
        working-directory: services/scanner-runner
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'

      - name: Audit (moderate)
        run: bun audit --audit-level=moderate --ignore GHSA-8988-4f7v-96qf
        working-directory: services/scanner-runner

      - name: Install Playwright browser
        run: bunx playwright install --with-deps chromium
        working-directory: services/scanner-runner

      - name: CI
        run: bun run ci
        working-directory: services/scanner-runner

  dead_code:
    name: Dead Code
    runs-on: ubuntu-latest
    needs: workflow_lint
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: '**/*.sum'

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Generate schema contracts
        run: ./devtools/scripts/generate-contracts.sh

      - name: Install scanner-runner dependencies
        run: bun install --frozen-lockfile
        working-directory: services/scanner-runner
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'

      - name: Install web dependencies
        run: bun install --frozen-lockfile
        working-directory: clients/web

      - name: Setup just
        uses: taiki-e/install-action@7572810d7dd469b651bb7793945692cf78da5dd7 # v2.85.0
        with:
          tool: just@${{ env.JUST_VERSION }}

      # Both Bun workspaces, matching `just dead-code`. clients/web had no
      # dead-code detection at all, which is how seven unused exports and two
      # unreferenced modules accumulated there.
      - name: Dead-code analysis
        run: just dead-code

  # Reports coverage rather than gating on a threshold. The Go side ratchets
  # against devtools/coverage-baseline.json, so the question a failure asks is
  # "did this change make it worse?" rather than "why is the floor 60?". Kept as
  # its own job so ~854 Go tests are not run twice on the critical path of the
  # `go` job, which already runs them under -race.
  coverage:
    name: Coverage (Go ratchet, web report)
    runs-on: ubuntu-latest
    needs: workflow_lint
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: '**/*.sum'

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Generate schema contracts
        run: ./devtools/scripts/generate-contracts.sh

      - name: Go coverage and ratchet
        run: |
          {
            echo '## Go coverage'
            echo ''
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          set +e
          bash devtools/scripts/go/coverage.sh 2>&1 | tee coverage-run.log
          status="${PIPESTATUS[0]}"
          set -e

          {
            cat coverage-run.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          exit "$status"

      - name: Web dependencies
        run: bun install --frozen-lockfile
        working-directory: clients/web

      # Report-only: no thresholds yet, so this must not fail the job on a number.
      - name: Web coverage
        run: |
          {
            echo ''
            echo '## Web coverage'
            echo ''
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          bun run test:coverage 2>&1 | tee ../../web-coverage.log

          {
            sed -n '/Coverage summary/,$p' ../../web-coverage.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
        working-directory: clients/web

      # Per-module HTML so a reviewer can open the real line-by-line report rather
      # than trusting a percentage.
      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-reports
          path: |
            artifacts/coverage/*.html
            artifacts/coverage/measured.json
            clients/web/coverage/
          retention-days: 14
          if-no-files-found: warn

  images:
    name: Container Image (${{ matrix.image.name }})
    runs-on: ubuntu-latest
    needs: workflow_lint
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        image:
          - name: platform-api
            dockerfile: services/platform-api/Dockerfile
          - name: orchestrator
            dockerfile: services/orchestrator/Dockerfile
          - name: extractor
            dockerfile: services/archive-extractor/Dockerfile
          - name: scanner-runner
            dockerfile: services/scanner-runner/Dockerfile
          - name: frontend-react
            dockerfile: clients/web/Dockerfile
    steps:
      - uses: actions/checkout@v7

      - name: Build image
        run: docker build -f "${{ matrix.image.dockerfile }}" -t "stageflow/${{ matrix.image.name }}:ci" .

      - name: Generate SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          image: stageflow/${{ matrix.image.name }}:ci
          artifact-name: sbom-${{ matrix.image.name }}
          output-file: ./sbom-${{ matrix.image.name }}.spdx.json
          upload-artifact: false

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v7
        with:
          name: sbom-${{ matrix.image.name }}
          path: ./sbom-${{ matrix.image.name }}.spdx.json
          if-no-files-found: error
          retention-days: 7

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: stageflow/${{ matrix.image.name }}:ci
          format: table
          exit-code: 1
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH

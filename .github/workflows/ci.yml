name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: '1.26.10'
  GOTOOLCHAIN: 'go1.26.10'
  NODE_VERSION: '24'
  BUN_VERSION: '1.3.8'
  JUST_VERSION: '1.55.1'

jobs:
  gate:
    name: Local quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: go.sum
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177 # v2.87.30
        with:
          tool: just@${{ env.JUST_VERSION }}
      - name: Install PostgreSQL test tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends postgresql postgresql-client ripgrep shellcheck
          postgres_bin=
          for directory in /usr/lib/postgresql/*/bin; do
            if [[ -x "$directory/initdb" && -x "$directory/pg_dump" ]]; then
              postgres_bin="$directory"
              break
            fi
          done
          test -n "$postgres_bin"
          echo "$postgres_bin" >> "$GITHUB_PATH"
      - name: Install dependencies
        run: |
          command -v shellcheck
          just deps
          cd clients/web
          bun x playwright install --with-deps chromium
      - name: Run the local gate
        run: just ci

  web-e2e:
    name: Browser e2e
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: go.sum
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177 # v2.87.30
        with:
          tool: just@${{ env.JUST_VERSION }}
      - name: Install web dependencies and Chromium
        working-directory: clients/web
        run: |
          bun install --frozen-lockfile
          bun x playwright install --with-deps chromium
      - name: Run browser e2e
        run: just web-e2e

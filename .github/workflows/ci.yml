name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true
          cache-dependency-path: "**/*.sum"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install golangci-lint
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.8.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      # Go checks (workspace: build/test each module)
      - name: Go build
        run: |
          for dir in $(awk '/^\t\.\//{gsub(/^\t/, ""); print}' go.work); do
            echo "==> Building $dir"
            (cd "$dir" && go build ./...)
          done

      - name: Go lint
        run: golangci-lint run

      - name: Go test
        run: |
          for dir in $(awk '/^\t\.\//{gsub(/^\t/, ""); print}' go.work); do
            echo "==> Testing $dir"
            (cd "$dir" && go test -race ./...)
          done

      # Frontend checks
      - name: Frontend install
        run: bun install --frozen-lockfile
        working-directory: frontend

      - name: Frontend CI
        run: bun run ci
        working-directory: frontend

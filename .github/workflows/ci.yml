name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

defaults:
  run:
    shell: bash

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.26.3"
  NODE_VERSION: "22"
  BUN_VERSION: "1.3.8"
  GOLANGCI_LINT_VERSION: "v2.12.2"
  GOVULNCHECK_VERSION: "v1.1.4"

jobs:
  workflow_lint:
    name: Workflow Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false

      - name: Verify shellcheck
        run: command -v shellcheck

      - name: Install actionlint
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Lint workflows
        run: actionlint -color -shellcheck="$(command -v shellcheck)"

  secrets:
    name: Secrets (gitleaks)
    runs-on: ubuntu-latest
    needs: workflow_lint
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  go:
    name: Go (build, lint, test, vuln)
    runs-on: ubuntu-latest
    needs: workflow_lint
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: "**/*.sum"

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install tools
        run: |
          go install "github.com/golangci/golangci-lint/v2/cmd/golangci-lint@${GOLANGCI_LINT_VERSION}"
          go install "golang.org/x/vuln/cmd/govulncheck@${GOVULNCHECK_VERSION}"
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Validate event contract fixtures
        run: bun install --frozen-lockfile && bun run validate:fixtures
        working-directory: libs/contracts/events

      - name: Go build
        run: bash devtools/scripts/go/run-in-work-dirs.sh Building go build ./...

      - name: Go lint
        run: bash devtools/scripts/go/run-in-work-dirs.sh Linting golangci-lint run

      - name: Go test
        run: bash devtools/scripts/go/run-in-work-dirs.sh Testing go test -race ./...

      - name: CLI docs stay generated
        run: |
          go run ./clients/cli docs --out-dir docs/reference/cli/stageflow
          git diff --exit-code docs/reference/cli/stageflow

      - name: Shell regression tests
        run: bash devtools/scripts/tests/cli-install.test.sh

      - name: Go vulncheck
        run: bash devtools/scripts/go/run-in-work-dirs.sh Vulncheck govulncheck ./...

  clients_web:
    name: Web App (lint, typecheck, test)
    runs-on: ubuntu-latest
    needs: workflow_lint
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install
        run: bun install --frozen-lockfile
        working-directory: clients/web

      - name: Audit (high)
        run: bun audit --audit-level=high
        working-directory: clients/web

      - name: CI
        run: bun run ci
        working-directory: clients/web

      - name: Build and check asset budget
        run: |
          bun run build
          bun run check:asset-budget
        working-directory: clients/web

  clients_web_storybook:
    name: Web App Storybook (interaction + a11y)
    runs-on: ubuntu-latest
    needs: workflow_lint
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install
        run: bun install --frozen-lockfile
        working-directory: clients/web

      - name: Install Playwright browser
        run: bunx playwright install --with-deps chromium
        working-directory: clients/web

      - name: Build Storybook
        run: bun run build-storybook
        working-directory: clients/web

      - name: Storybook tests
        run: bun run test-storybook:ci
        working-directory: clients/web

      - name: Upload Storybook test artifacts
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: clients-web-storybook-artifacts
          path: |
            clients/web/junit.xml
            clients/web/test-results
            clients/web/storybook-static
          if-no-files-found: ignore
          retention-days: 7

  scanner-runner:
    name: Scanner Runner (lint, typecheck, test)
    runs-on: ubuntu-latest
    needs: workflow_lint
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install
        run: bun install --frozen-lockfile
        working-directory: services/scanner-runner
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"

      - name: Audit (high)
        run: bun audit --audit-level=high
        working-directory: services/scanner-runner

      - name: Install Playwright browser
        run: bunx playwright install --with-deps chromium
        working-directory: services/scanner-runner

      - name: CI
        run: bun run ci
        working-directory: services/scanner-runner

  dead_code:
    # Temporary non-blocking portfolio-polish gate. The current scanner-runner
    # analysis still reports exported integration types and one workspace
    # dependency as false positives; keep the signal visible until those are
    # resolved.
    name: Dead Code (temporary non-blocking)
    runs-on: ubuntu-latest
    needs: workflow_lint
    timeout-minutes: 20
    continue-on-error: true
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install web dependencies
        run: bun install --frozen-lockfile
        working-directory: clients/web

      - name: Install scanner-runner dependencies
        run: bun install --frozen-lockfile
        working-directory: services/scanner-runner
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"

      - name: Dead-code analysis
        run: |
          status=0
          (cd clients/web && bun run find-dead-code) || status=$?
          (cd services/scanner-runner && bun run find-dead-code) || status=$?
          (cd services/scanner-runner && bun run analyze:dead) || status=$?
          exit "$status"

  images:
    name: Container Image (${{ matrix.image.name }})
    runs-on: ubuntu-latest
    needs: workflow_lint
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        image:
          - name: platform-api
            dockerfile: services/platform-api/Dockerfile
          - name: orchestrator
            dockerfile: services/orchestrator/Dockerfile
          - name: extractor
            dockerfile: services/archive-extractor/Dockerfile
          - name: scanner-runner
            dockerfile: services/scanner-runner/Dockerfile
          - name: frontend
            dockerfile: clients/web/Dockerfile
    steps:
      - uses: actions/checkout@v6

      - name: Build image
        run: docker build -f "${{ matrix.image.dockerfile }}" -t "stageflow/${{ matrix.image.name }}:ci" .

      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          image: stageflow/${{ matrix.image.name }}:ci
          artifact-name: sbom-${{ matrix.image.name }}
          output-file: ./sbom-${{ matrix.image.name }}.spdx.json
          upload-artifact: false

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v6
        with:
          name: sbom-${{ matrix.image.name }}
          path: ./sbom-${{ matrix.image.name }}.spdx.json
          if-no-files-found: error
          retention-days: 7

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: stageflow/${{ matrix.image.name }}:ci
          format: table
          exit-code: 1
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH

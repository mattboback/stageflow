name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  go:
    name: Go (build, lint, test, vuln)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26.1"
          cache: true
          cache-dependency-path: "**/*.sum"

      - name: Install tools
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.8.0
          go install golang.org/x/vuln/cmd/govulncheck@v1.1.4
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Go build
        run: |
          for dir in $(awk '/^[[:space:]]+\\.\\//{gsub(/^[[:space:]]+/, ""); print}' go.work); do
            echo "==> Building $dir"
            (cd "$dir" && go build ./...)
          done

      - name: Go lint
        run: |
          for dir in $(awk '/^[[:space:]]+\\.\\//{gsub(/^[[:space:]]+/, ""); print}' go.work); do
            echo "==> Linting $dir"
            (cd "$dir" && golangci-lint run)
          done

      - name: Go test
        run: |
          for dir in $(awk '/^[[:space:]]+\\.\\//{gsub(/^[[:space:]]+/, ""); print}' go.work); do
            echo "==> Testing $dir"
            (cd "$dir" && go test -race ./...)
          done

      - name: Go vulncheck
        run: |
          for dir in $(awk '/^[[:space:]]+\\.\\//{gsub(/^[[:space:]]+/, ""); print}' go.work); do
            echo "==> Vulncheck $dir"
            (cd "$dir" && govulncheck ./...)
          done

  clients/web:
    name: Frontend (lint, typecheck, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.8"

      - name: Install
        run: bun install --frozen-lockfile
        working-directory: clients/web

      - name: Audit (high)
        run: bun audit --audit-level=high
        working-directory: clients/web

      - name: CI
        run: bun run ci
        working-directory: clients/web

  clients/web-storybook:
    name: Frontend Storybook (interaction + a11y)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.8"

      - name: Install
        run: bun install --frozen-lockfile
        working-directory: clients/web

      - name: Install Playwright browser
        run: bunx playwright install --with-deps chromium
        working-directory: clients/web

      - name: Build Storybook
        run: bun run build-storybook
        working-directory: clients/web

      - name: Storybook tests
        run: bun run test-storybook:ci
        working-directory: clients/web

      - name: Upload Storybook test artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: clients/web-storybook-artifacts
          path: |
            clients/web/junit.xml
            clients/web/test-results
            clients/web/storybook-static
          if-no-files-found: ignore

  scanner-runner:
    name: Scanner Runner (lint, typecheck, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.8"

      - name: Install
        run: bun install --frozen-lockfile
        working-directory: services/scanner-runner
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"

      - name: Audit (high)
        run: bun audit --audit-level=high
        working-directory: services/scanner-runner

      - name: CI
        run: bun run ci
        working-directory: services/scanner-runner

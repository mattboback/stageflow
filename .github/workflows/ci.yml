name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  workflow_lint:
    name: Workflow Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26.1"
          cache: false

      - name: Verify shellcheck
        run: command -v shellcheck

      - name: Install actionlint
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Lint workflows
        run: actionlint -color -shellcheck="$(command -v shellcheck)"

  secrets:
    name: Secrets (gitleaks)
    runs-on: ubuntu-latest
    needs: workflow_lint
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  go:
    name: Go (build, lint, test, vuln)
    runs-on: ubuntu-latest
    needs: workflow_lint
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26.1"
          cache: true
          cache-dependency-path: "**/*.sum"

      - name: Install tools
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.8.0
          go install golang.org/x/vuln/cmd/govulncheck@v1.1.4
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Validate event contract fixtures
        run: node libs/contracts/events/schema/validate.mjs

      - name: Go build
        run: |
          while IFS= read -r dir; do
            echo "==> Building $dir"
            (cd "$dir" && go build ./...)
          done < <(bash devtools/scripts/go/go-work-dirs.sh)

      - name: Go lint
        run: |
          while IFS= read -r dir; do
            echo "==> Linting $dir"
            (cd "$dir" && golangci-lint run)
          done < <(bash devtools/scripts/go/go-work-dirs.sh)

      - name: Go test
        run: |
          while IFS= read -r dir; do
            echo "==> Testing $dir"
            (cd "$dir" && go test -race ./...)
          done < <(bash devtools/scripts/go/go-work-dirs.sh)

      - name: CLI docs stay generated
        run: |
          go run ./clients/cli docs --out-dir docs/reference/cli/stageflow
          git diff --exit-code docs/reference/cli/stageflow

      - name: Shell regression tests
        run: bash devtools/scripts/tests/cli-install.test.sh

      - name: Go vulncheck
        run: |
          while IFS= read -r dir; do
            echo "==> Vulncheck $dir"
            (cd "$dir" && govulncheck ./...)
          done < <(bash devtools/scripts/go/go-work-dirs.sh)

  clients_web:
    name: Web App (lint, typecheck, test)
    runs-on: ubuntu-latest
    needs: workflow_lint
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.8"

      - name: Install
        run: bun install --frozen-lockfile
        working-directory: clients/web

      - name: Audit (high)
        run: bun audit --audit-level=high
        working-directory: clients/web

      - name: CI
        run: bun run ci
        working-directory: clients/web

  clients_web_storybook:
    name: Web App Storybook (interaction + a11y)
    runs-on: ubuntu-latest
    needs: workflow_lint
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.8"

      - name: Install
        run: bun install --frozen-lockfile
        working-directory: clients/web

      - name: Install Playwright browser
        run: bunx playwright install --with-deps chromium
        working-directory: clients/web

      - name: Build Storybook
        run: bun run build-storybook
        working-directory: clients/web

      - name: Storybook tests
        run: bun run test-storybook:ci
        working-directory: clients/web

      - name: Upload Storybook test artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: clients-web-storybook-artifacts
          path: |
            clients/web/junit.xml
            clients/web/test-results
            clients/web/storybook-static
          if-no-files-found: ignore
          retention-days: 7

  scanner-runner:
    name: Scanner Runner (lint, typecheck, test)
    runs-on: ubuntu-latest
    needs: workflow_lint
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.8"

      - name: Install
        run: bun install --frozen-lockfile
        working-directory: services/scanner-runner
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"

      - name: Audit (high)
        run: bun audit --audit-level=high
        working-directory: services/scanner-runner

      - name: Install Playwright browser
        run: bunx playwright install --with-deps chromium
        working-directory: services/scanner-runner

      - name: CI
        run: bun run ci
        working-directory: services/scanner-runner

  images:
    name: Container Images (build)
    runs-on: ubuntu-latest
    needs: workflow_lint
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6

      - name: Build platform-api image
        run: docker build -f services/platform-api/Dockerfile -t stageflow/platform-api:ci .

      - name: Build orchestrator image
        run: docker build -f services/orchestrator/Dockerfile -t stageflow/orchestrator:ci .

      - name: Build archive-extractor image
        run: docker build -f services/archive-extractor/Dockerfile -t stageflow/extractor:ci .

      - name: Build scanner-runner image
        run: docker build -f services/scanner-runner/Dockerfile -t stageflow/scanner-runner:ci .

      - name: Build frontend image
        run: docker build -f clients/web/Dockerfile -t stageflow/frontend:ci .

name: Bug report
description: Report a reproducible problem with StageFlow.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened?
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Include minimal steps and configuration needed.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs / output
      description: Paste relevant logs. Redact secrets.
      render: shell

  - type: input
    id: version
    attributes:
      label: Version / commit
      description: Tag or commit SHA.

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, Podman/Docker versions, Go/Bun versions, and any relevant details.
    validations:
      required: true


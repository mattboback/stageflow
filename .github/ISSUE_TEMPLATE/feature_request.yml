name: Feature request
description: Propose a focused improvement to StageFlow.
title: "[Feature]: "
body:
  - type: markdown
    attributes:
      value: |
        Explain the user problem first. A concrete workflow is more useful than a proposed implementation alone.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Who is affected, what are they trying to do, and what blocks them today?
      placeholder: When I maintain multiple frontend projects, I need to...
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: Describe the observable behavior that would solve the problem.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Note current workarounds or simpler alternatives, if any.
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Web experience
        - CLI
        - Scanner runtime or plugin
        - Platform API or orchestration
        - Self-hosting and operations
        - Documentation and contributor experience
    validations:
      required: true

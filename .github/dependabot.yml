version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

  - package-ecosystem: "gomod"
    directory: "/packages/contracts/report/generated/go"
    schedule:
      interval: "weekly"

  - package-ecosystem: "gomod"
    directory: "/packages/contracts/scanner-manifest"
    schedule:
      interval: "weekly"

  - package-ecosystem: "gomod"
    directory: "/packages/shared-go"
    schedule:
      interval: "weekly"

  - package-ecosystem: "gomod"
    directory: "/platform/api"
    schedule:
      interval: "weekly"

  - package-ecosystem: "gomod"
    directory: "/platform/extractor"
    schedule:
      interval: "weekly"

  - package-ecosystem: "gomod"
    directory: "/platform/orchestrator"
    schedule:
      interval: "weekly"

  - package-ecosystem: "gomod"
    directory: "/tests/e2e"
    schedule:
      interval: "weekly"

  - package-ecosystem: "gomod"
    directory: "/tools/job-status-cli"
    schedule:
      interval: "weekly"

  - package-ecosystem: "gomod"
    directory: "/tools/suite-runner"
    schedule:
      interval: "weekly"


# Local development overrides
# Prefer `just dev up local`. For direct compose usage, create and export the
# external network first: `export STAGEFLOW_NETWORK_NAME=stageflow_dev_net &&
# podman network create "$STAGEFLOW_NETWORK_NAME"`.

services:
  frontend-react:
    build:
      context: ../..
      dockerfile: clients/web/Dockerfile
      args:
        VITE_API_URL: http://localhost:8080
        VITE_SITE_TITLE: ${VITE_SITE_TITLE:-StageFlow}
        VITE_SITE_URL: ${VITE_SITE_URL:-http://localhost:3020}
        VITE_GITHUB_URL: ${VITE_GITHUB_URL:-https://github.com/mattboback/stageflow}
        VITE_TAGLINE: ${VITE_TAGLINE:-Self-hostable frontend quality regression scanning}
    ports:
      - "127.0.0.1:3020:3020"

  platform-api:
    environment:
      # Public scans need no key. Private targets (local development URLs)
      # also need PLATFORM_API_TOKEN from .env, sent by the CLI as
      # STAGEFLOW_API_KEY.
      PLATFORM_API_ALLOW_PRIVATE_TARGETS: "true"
      MINIO_PUBLIC_ENDPOINT: "localhost:9000"
      MINIO_PUBLIC_USE_SSL: "false"
      MINIO_USE_PROXY_URLS: "false"
      PLATFORM_API_CORS_ALLOW_ORIGINS: http://localhost:8080,http://localhost:3020,http://127.0.0.1:3020
    ports:
      - "127.0.0.1:8080:8080"

  orchestrator:
    user: "1000:1000"
    userns_mode: "keep-id"
    environment:
      POD_NETNS_MODE: "host"
      POD_NETWORK: ""

  minio:
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"

  nats:
    ports:
      - "127.0.0.1:4222:4222"

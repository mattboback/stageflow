# Development overlay - exposes ports for local testing
# Prefer `just dev up`. For direct compose usage, create and export the external
# network first: `export STAGEFLOW_NETWORK_NAME=stageflow_dev_net && podman network
# create "$STAGEFLOW_NETWORK_NAME"`.

services:
  nats:
    ports:
      - "127.0.0.1:4222:4222"

  minio:
    environment:
      MINIO_DOMAIN: localhost
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"

  grafana:
    ports:
      - "127.0.0.1:3001:3001"

  platform-api:
    environment:
      # Repo-local dev/demo stack runs unauthenticated on loopback so `just demo`,
      # the printed CLI/curl commands, and the Web UI work without a key. The base
      # compose keeps auth enabled for staging/self-host deployments.
      PLATFORM_API_AUTH_DISABLED: "true"
      MINIO_PUBLIC_ENDPOINT: "localhost:9000"
      MINIO_PUBLIC_USE_SSL: "false"
      MINIO_USE_PROXY_URLS: "false"
      PLATFORM_API_CORS_ALLOW_ORIGINS: http://localhost:3000,http://127.0.0.1:3000,http://localhost:3020,http://127.0.0.1:3020
    ports:
      - "127.0.0.1:8080:8080"

  orchestrator:
    ports:
      - "127.0.0.1:8081:8081"

  frontend:
    ports:
      - "127.0.0.1:3000:3000"

  frontend-react:
    ports:
      - "127.0.0.1:3020:3020"

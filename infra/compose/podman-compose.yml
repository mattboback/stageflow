# StageFlow Compose: local settings come from .env.
# Host ports bind to loopback; use a reverse proxy for public deployments.

name: ${COMPOSE_PROJECT_NAME:-stageflow_dev}

services:
  # --- Infrastructure ---

  postgres:
    image: docker.io/library/postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-stageflow}
      POSTGRES_USER: ${POSTGRES_USER:-stageflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    volumes:
      - postgres_v2_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-stageflow} -d ${POSTGRES_DB:-stageflow} || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "2.0"
        reservations:
          memory: 128M
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true
    networks:
      - stageflow_net
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"

  platform-api:
    ports:
      - "127.0.0.1:${PLATFORM_API_PORT:-8080}:8080"
    build:
      context: ../..
      dockerfile: services/platform-api/Dockerfile
    image: localhost/stageflow/platform-api:${IMAGE_TAG:-latest}
    user: "65532:65532"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m
    environment:
      HOME: "/tmp"
      PORT: "8080"
      PLATFORM_API_ALLOW_PRIVATE_TARGETS: "${PLATFORM_API_ALLOW_PRIVATE_TARGETS:-false}"
      PLATFORM_API_TOKEN: ${PLATFORM_API_TOKEN:-}
      PLATFORM_API_PUBLIC_SUBMISSION_RATE_LIMIT_RPM: ${PLATFORM_API_PUBLIC_SUBMISSION_RATE_LIMIT_RPM:-6}
      PLATFORM_API_PUBLIC_SUBMISSION_RATE_LIMIT_BURST: ${PLATFORM_API_PUBLIC_SUBMISSION_RATE_LIMIT_BURST:-3}
      PLATFORM_API_TRUSTED_PROXIES: ${PLATFORM_API_TRUSTED_PROXIES:-127.0.0.1/32,::1/128}
      PLATFORM_API_CORS_ALLOW_ORIGINS: ${PLATFORM_API_CORS_ALLOW_ORIGINS:-http://localhost:${FRONTEND_PORT:-3000},http://127.0.0.1:${FRONTEND_PORT:-3000},http://localhost:3020,http://127.0.0.1:3020}
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL must be set}
    volumes:
      - stageflow_data:/data
    healthcheck:
      test: ["CMD", "/usr/local/bin/platform-api-healthcheck"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "2.0"
        reservations:
          memory: 128M
    depends_on:
      orchestrator:
        condition: service_healthy
    stop_grace_period: 30s
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true
    networks:
      - stageflow_net
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  orchestrator:
    ports:
      - "127.0.0.1:${ORCHESTRATOR_PORT:-8081}:8081"
    build:
      context: ../..
      dockerfile: services/orchestrator/Dockerfile
    image: localhost/stageflow/orchestrator:${IMAGE_TAG:-latest}
    # Rootless container root maps to the host socket owner.
    user: "0:0"
    security_opt:
      # label=disable is required so the container can access the relabeled
      # rootless Podman socket; SELinux confinement cannot be scoped per-mount in
      # compose. Self-hosters on a non-SELinux host can drop this line.
      - label=disable
      - no-new-privileges:true
    volumes:
      - stageflow_data:/data
      - ${XDG_RUNTIME_DIR}/podman/podman.sock:/run/podman/podman.sock:z
    environment:
      PODMAN_SOCKET: "/run/podman/podman.sock"
      # Podman control-plane budget. Creating a pod writes the pod record, creates
      # the infra container, and programs the netns, which on a loaded host runs
      # past a short timeout. The request timeout caps the whole exchange, so the
      # header timeout must stay <= it or it can never be reached.
      PODMAN_REQUEST_TIMEOUT: "${PODMAN_REQUEST_TIMEOUT:-120s}"
      PODMAN_RESPONSE_HEADER_TIMEOUT: "${PODMAN_RESPONSE_HEADER_TIMEOUT:-60s}"
      PODMAN_DIAL_TIMEOUT: "${PODMAN_DIAL_TIMEOUT:-5s}"
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL must be set}
      STAGEFLOW_DATA_VOLUME: ${STAGEFLOW_DATA_VOLUME:-${COMPOSE_PROJECT_NAME:-stageflow_dev}_data}
      EXTRACTION_IMAGE: "localhost/stageflow/extractor:${IMAGE_TAG:-latest}"
      SCANNER_IMAGE: "localhost/stageflow/scanner-runner:${IMAGE_TAG:-latest}"
      API_PORT: "8081"
      POD_NETNS_MODE: ${POD_NETNS_MODE:-bridge}
      # An explicitly empty POD_NETWORK is required for host mode.
      POD_NETWORK: ${POD_NETWORK-${STAGEFLOW_NETWORK_NAME:-${COMPOSE_PROJECT_NAME:-stageflow_dev}_net}}
    healthcheck:
      test: ["CMD", "/usr/local/bin/orchestrator-healthcheck"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "4.0"
        reservations:
          memory: 128M
    depends_on:
      postgres:
        condition: service_healthy
    stop_grace_period: 60s
    restart: unless-stopped
    init: true
    networks:
      - stageflow_net
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

  # --- Frontend ---
  frontend-react:
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-3000}:3020"
    build:
      context: ../..
      dockerfile: clients/web/Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:${PLATFORM_API_PORT:-8080}}
        VITE_SITE_URL: ${VITE_SITE_URL:-http://localhost:${FRONTEND_PORT:-3000}}
        VITE_DEPLOYMENT_MODE: ${VITE_DEPLOYMENT_MODE:-self-hosted}
    image: localhost/stageflow/frontend-react:${IMAGE_TAG:-latest}
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:3020/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 64M
          cpus: "0.5"
        reservations:
          memory: 16M
    depends_on:
      platform-api:
        condition: service_healthy
    stop_grace_period: 10s
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true
    networks:
      - stageflow_net
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"


volumes:
  postgres_v2_data:
  stageflow_data:
    name: ${STAGEFLOW_DATA_VOLUME:-${COMPOSE_PROJECT_NAME:-stageflow_dev}_data}

networks:
  stageflow_net:
    external: true
    name: ${STAGEFLOW_NETWORK_NAME:-${COMPOSE_PROJECT_NAME:-stageflow_dev}_net}

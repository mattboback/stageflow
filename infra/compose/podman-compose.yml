# StageFlow Base Compose
# No host ports are exposed here; apply an overlay (prod/test/local) to bind ports.

services:
  # --- Infrastructure ---
  nats:
    image: docker.io/library/nats:2.12.2-alpine
    command: ["-js", "-sd", "/data"]
    volumes:
      - nats_data:/data
    healthcheck:
      test: ["CMD", "nats-server", "--help"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 64M
    restart: unless-stopped
    networks:
      - stageflow_net
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  minio:
    image: docker.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_DOMAIN: ${STAGEFLOW_PUBLIC_DOMAIN:-stageflow.org}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 128M
    restart: unless-stopped
    networks:
      - stageflow_net
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"

  postgres:
    image: docker.io/library/postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-stageflow}
      POSTGRES_USER: ${POSTGRES_USER:-stageflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-stageflow} -d ${POSTGRES_DB:-stageflow} || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 128M
    restart: unless-stopped
    networks:
      - stageflow_net
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"

  grafana:
    image: docker.io/grafana/grafana:12.2.0
    environment:
      GF_SECURITY_ADMIN_USER: ${GF_SECURITY_ADMIN_USER:?GF_SECURITY_ADMIN_USER must be set}
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD:?GF_SECURITY_ADMIN_PASSWORD must be set}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_SERVER_ROOT_URL: ${GF_SERVER_ROOT_URL:?GF_SERVER_ROOT_URL must be set}
      GF_SERVER_HTTP_PORT: "3001"
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      POSTGRES_DB: ${POSTGRES_DB:-stageflow}
      POSTGRES_USER: ${POSTGRES_USER:-stageflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    volumes:
      - grafana_data:/var/lib/grafana
      - ../../infra/grafana/provisioning:/etc/grafana/provisioning:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:3001/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 64M
    depends_on:
      postgres:
        condition: service_healthy
      orchestrator:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - stageflow_net
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # --- Platform Services ---
  platform-api:
    build:
      context: ../..
      dockerfile: services/platform-api/Dockerfile
    image: localhost/stageflow/platform-api:latest
    environment:
      PORT: "8080"
      NATS_URL: "nats://nats:4222"
      SCANNER_CONFIG_PATH: "/data/scanners.yaml"
      MINIO_ENDPOINT: "minio:9000"
      MINIO_PUBLIC_ENDPOINT: ${STAGEFLOW_PUBLIC_DOMAIN:-stageflow.org}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      MINIO_USE_SSL: "false"
      MINIO_PUBLIC_USE_SSL: "true"
      MINIO_USE_PROXY_URLS: "true"
      PLATFORM_API_CORS_ALLOW_ORIGINS: ${PLATFORM_API_CORS_ALLOW_ORIGINS:-https://${STAGEFLOW_PUBLIC_DOMAIN:-stageflow.org},https://www.${STAGEFLOW_PUBLIC_DOMAIN:-stageflow.org}}
      ORCHESTRATOR_API_URL: "http://orchestrator:8081"
    volumes:
      - web_server_data:/data
      - ../../infra/scanners/scanners.yaml:/data/scanners.yaml:ro
    healthcheck:
      test: ["CMD", "/usr/local/bin/platform-api-healthcheck"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 128M
    depends_on:
      nats:
        condition: service_healthy
      minio:
        condition: service_healthy
      orchestrator:
        condition: service_healthy
    stop_grace_period: 30s
    restart: unless-stopped
    networks:
      - stageflow_net
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  orchestrator:
    build:
      context: ../..
      dockerfile: services/orchestrator/Dockerfile
    image: localhost/stageflow/orchestrator:latest
    security_opt:
      - label=disable
    volumes:
      - ${XDG_RUNTIME_DIR}/podman/podman.sock:/run/podman/podman.sock:z
      - ../../infra/scanners/scanners.yaml:/data/scanners.yaml:ro
    environment:
      NATS_URL: "nats://nats:4222"
      PODMAN_SOCKET: "/run/podman/podman.sock"
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL must be set}
      SCANNER_CONFIG_PATH: "/data/scanners.yaml"
      MINIO_ENDPOINT: "minio:9000"
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      MINIO_USE_SSL: "false"
      EXTRACTION_IMAGE: "localhost/stageflow/extractor:latest"
      SCANNER_IMAGE: "localhost/stageflow/scanner-runner:latest"
      API_PORT: "8081"
      NATS_HOST: "nats"
      MINIO_HOST: "minio"
      POD_NETWORK: ${STAGEFLOW_NETWORK_NAME:-stageflow_net}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      OPENROUTER_APP_TITLE: ${OPENROUTER_APP_TITLE}
      OPENROUTER_APP_REFERER: ${OPENROUTER_APP_REFERER}
    healthcheck:
      test: ["CMD-SHELL", "/busybox/wget -q --spider http://localhost:8081/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 128M
    depends_on:
      nats:
        condition: service_healthy
      minio:
        condition: service_healthy
      postgres:
        condition: service_healthy
    stop_grace_period: 60s
    restart: unless-stopped
    networks:
      - stageflow_net
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

  # --- Frontend ---
  frontend:
    build:
      context: ../..
      dockerfile: clients/web/Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8080}
        VITE_SITE_TITLE: ${VITE_SITE_TITLE:-StageFlow}
        VITE_SITE_URL: ${VITE_SITE_URL:-http://localhost:3000}
        VITE_GITHUB_URL: ${VITE_GITHUB_URL:-https://github.com/mattboback/stageflow}
        VITE_TAGLINE: ${VITE_TAGLINE:-Podman-native web accessibility scanning platform}
    image: localhost/stageflow/frontend:latest
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:3000/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 64M
        reservations:
          memory: 16M
    depends_on:
      platform-api:
        condition: service_healthy
    stop_grace_period: 10s
    restart: unless-stopped
    networks:
      - stageflow_net
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  nats_data:
  minio_data:
  postgres_data:
  web_server_data:
  grafana_data:

networks:
  stageflow_net:
    external: true
    name: ${STAGEFLOW_NETWORK_NAME:-stageflow_net}

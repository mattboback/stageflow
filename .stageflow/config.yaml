version: 1

stageflow:
  api_url: "http://localhost:8080"

scan:
  # Set this to the page URL your dev server serves.
  urls:
    - http://127.0.0.1:5173
  scanners: axe,lighthouse,seo,link-checker
  allow_private_targets: true

dev:
  start:
    # best guess from Justfile recipe `run`
    cmd: ["just", "run", "clients/web"]
    cwd: .
    env:
      VITE_API_URL: http://localhost:8080
      VITE_SITE_URL: http://127.0.0.1:5173
  ready:
    # Match this to your dev server URL.
    url: http://127.0.0.1:5173

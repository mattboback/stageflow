version: 1

stageflow:
  api_url: "http://localhost:8080"

scan:
  # TODO: update this URL to your local dev server.
  urls:
    - http://127.0.0.1:3000
  scanners: axe,lighthouse,seo,security-headers
  allow_private_targets: true
  timeout: 10m

dev:
  start:
    # TODO: replace with your local dev start command.
    cmd: ["npm", "run", "dev"]
    cwd: .
  ready:
    # TODO: match this to the URL your dev server serves.
    url: http://127.0.0.1:3000
    timeout: 2m
    interval: 1s
  stop:
    signal: SIGINT
    timeout: 20s

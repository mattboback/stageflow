server {
	listen 3020;
	server_name _;

	# Don't advertise the nginx version in responses or error pages.
	server_tokens off;

	root /usr/share/nginx/html;
	index index.html;

	# nginx is behind Caddy on port 3020. Without this, `return 302 /path` and
	# trailing-slash auto-redirects emit `Location: http://<host>:3020/...`,
	# which (a) downgrades https→http, (b) leaks the internal port, and
	# (c) trips the upstream CSP `default-src 'self'` for favicon.svg.
	absolute_redirect off;
	port_in_redirect off;

	location /api/ {
		# The API accepts a 100 MiB ZIP plus bounded multipart metadata.
		client_max_body_size 102m;
		proxy_pass http://platform-api:8080;
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
	}

	location = /favicon.ico {
		return 302 /favicon.svg;
	}

	location ~* ^/(?:assets/.*\.(?:js|css|woff2|woff|ttf|eot)|.*\.(?:js|css|woff2|woff|ttf|eot))$ {
		add_header Cache-Control "public, max-age=31536000, immutable";
		add_header X-Content-Type-Options "nosniff" always;
		try_files $uri =404;
	}

	location ~* ^/.*\.(?:jpg|jpeg|png|gif|ico|svg|webp)$ {
		add_header Cache-Control "public, max-age=31536000";
		add_header X-Content-Type-Options "nosniff" always;
		try_files $uri =404;
	}

	location = /playground {
		add_header Cache-Control "public, max-age=0, must-revalidate";
		add_header X-Content-Type-Options "nosniff" always;
		add_header X-Frame-Options "DENY" always;
		add_header Referrer-Policy "strict-origin-when-cross-origin" always;
		add_header Content-Security-Policy "frame-ancestors 'none'" always;
		try_files /playground/index.html =404;
	}

	# /demo is an SPA route, but /demo/ is also the committed fixture-asset
	# directory (report.json, screenshots). Without this exact match, the
	# fallback's $uri/ clause sees that directory, 301s to /demo/, and then
	# 403s on its missing index — breaking the home page's main CTA.
	location = /demo {
		add_header Cache-Control "public, max-age=0, must-revalidate";
		add_header X-Content-Type-Options "nosniff" always;
		add_header X-Frame-Options "DENY" always;
		add_header Referrer-Policy "strict-origin-when-cross-origin" always;
		add_header Content-Security-Policy "frame-ancestors 'none'" always;
		try_files /__spa-fallback.html =404;
	}

	# HTML document responses carry the full security header set. CSP is limited
	# to frame-ancestors (anti-clickjacking) so it cannot break the SPA's own
	# scripts/styles; tighten further once a nonce/hash policy is in place.
	#
	# SPA fallback serves __spa-fallback.html (a barebones shell) for
	# non-prerendered routes — using /index.html would hand the client a
	# fully-prerendered landing DOM that doesn't match the route React Router is
	# about to mount, triggering hydration error #418 and a re-render flash.
	location / {
		add_header Cache-Control "public, max-age=0, must-revalidate";
		add_header X-Content-Type-Options "nosniff" always;
		add_header X-Frame-Options "DENY" always;
		add_header Referrer-Policy "strict-origin-when-cross-origin" always;
		add_header Content-Security-Policy "frame-ancestors 'none'" always;
		try_files $uri $uri/ /__spa-fallback.html;
	}
}

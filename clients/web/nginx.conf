server {
	listen 3020;
	server_name _;

	# Don't advertise the nginx version in responses or error pages.
	server_tokens off;

	root /usr/share/nginx/html;
	index index.html;

	# nginx is behind Caddy on port 3020. Without this, `return 302 /path` and
	# trailing-slash auto-redirects emit `Location: http://<host>:3020/...`,
	# which (a) downgrades https→http, (b) leaks the internal port, and
	# (c) trips the upstream CSP `default-src 'self'` for favicon.svg.
	absolute_redirect off;
	port_in_redirect off;

	location /api/ {
		# The API accepts a 100 MiB ZIP plus bounded multipart metadata.
		client_max_body_size 102m;
		proxy_pass http://platform-api:8080;
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
	}

	location = /favicon.ico {
		return 302 /favicon.svg;
	}

	location = /robots.txt {
		add_header Cache-Control "public, max-age=3600, must-revalidate";
		add_header X-Content-Type-Options "nosniff" always;
		try_files /robots.txt =404;
	}

	location = /sitemap.xml {
		add_header Cache-Control "public, max-age=3600, must-revalidate";
		add_header X-Content-Type-Options "nosniff" always;
		try_files /sitemap.xml =404;
	}

	location ~* ^/(?:assets/.*\.(?:js|css|woff2|woff|ttf|eot)|.*\.(?:js|css|woff2|woff|ttf|eot))$ {
		add_header Cache-Control "public, max-age=31536000, immutable";
		add_header X-Content-Type-Options "nosniff" always;
		try_files $uri =404;
	}

	location ~* ^/.*\.(?:jpg|jpeg|png|gif|ico|svg|webp)$ {
		add_header Cache-Control "public, max-age=31536000";
		add_header X-Content-Type-Options "nosniff" always;
		try_files $uri =404;
	}

	# Public JSON Schemas are real files; missing versions must not become SPA HTML.
	location ^~ /schemas/ {
		add_header Cache-Control "public, max-age=3600, must-revalidate";
		add_header X-Content-Type-Options "nosniff" always;
		try_files $uri =404;
	}

	location = /playground {
		add_header Cache-Control "public, max-age=0, must-revalidate";
		add_header X-Content-Type-Options "nosniff" always;
		add_header X-Frame-Options "DENY" always;
		add_header Referrer-Policy "strict-origin-when-cross-origin" always;
		add_header Content-Security-Policy "frame-ancestors 'none'" always;
		try_files /playground/index.html =404;
	}

	# Serve the prerendered demo alongside its static report and screenshots.
	location = /demo {
		add_header Cache-Control "public, max-age=0, must-revalidate";
		add_header X-Content-Type-Options "nosniff" always;
		add_header X-Frame-Options "DENY" always;
		add_header Referrer-Policy "strict-origin-when-cross-origin" always;
		add_header Content-Security-Policy "frame-ancestors 'none'" always;
		try_files /demo/index.html =404;
	}

	# HTML document responses carry the full security header set. CSP is limited
	# to frame-ancestors (anti-clickjacking) so it cannot break the SPA's own
	# scripts/styles; tighten further once a nonce/hash policy is in place.
	#
	# __spa-fallback.html is a barebones shell for routes that are not
	# prerendered. Using /index.html would hand the client the prerendered
	# landing DOM, which doesn't match the route React Router mounts (hydration
	# error #418 and a re-render flash).
	#
	# Scan pages are the only client-rendered routes, so they get the shell with
	# a 200.
	location ~ ^/scan/[^/]+(?:/report)?/?$ {
		add_header Cache-Control "public, max-age=0, must-revalidate";
		add_header X-Content-Type-Options "nosniff" always;
		add_header X-Frame-Options "DENY" always;
		add_header Referrer-Policy "strict-origin-when-cross-origin" always;
		add_header Content-Security-Policy "frame-ancestors 'none'" always;
		try_files /__spa-fallback.html =404;
	}

	# Everything else is a real file or a prerendered page. `$uri/index.html`
	# serves /projects without a trailing-slash redirect. An unknown path is a
	# real 404 whose body is the shell, so the client renders the not-found page.
	location / {
		add_header Cache-Control "public, max-age=0, must-revalidate";
		add_header X-Content-Type-Options "nosniff" always;
		add_header X-Frame-Options "DENY" always;
		add_header Referrer-Policy "strict-origin-when-cross-origin" always;
		add_header Content-Security-Policy "frame-ancestors 'none'" always;
		error_page 404 /__spa-fallback.html;
		try_files $uri $uri/index.html =404;
	}
}

server {
	listen 3020;
	server_name _;

	# Don't advertise the nginx version in responses or error pages.
	server_tokens off;

	root /usr/share/nginx/html;
	index index.html;

	location /api/ {
		proxy_pass http://platform-api:8080;
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
	}

	location = /favicon.ico {
		return 302 /favicon.svg;
	}

	location ~* ^/(?:assets/.*\.(?:js|css|woff2|woff|ttf|eot)|.*\.(?:js|css|woff2|woff|ttf|eot))$ {
		add_header Cache-Control "public, max-age=31536000, immutable";
		add_header X-Content-Type-Options "nosniff" always;
		try_files $uri =404;
	}

	location ~* ^/.*\.(?:jpg|jpeg|png|gif|ico|svg|webp)$ {
		add_header Cache-Control "public, max-age=31536000";
		add_header X-Content-Type-Options "nosniff" always;
		try_files $uri =404;
	}

	# HTML document responses carry the full security header set. CSP is limited
	# to frame-ancestors (anti-clickjacking) so it cannot break the SPA's own
	# scripts/styles; tighten further once a nonce/hash policy is in place.
	location / {
		add_header Cache-Control "public, max-age=0, must-revalidate";
		add_header X-Content-Type-Options "nosniff" always;
		add_header X-Frame-Options "DENY" always;
		add_header Referrer-Policy "strict-origin-when-cross-origin" always;
		add_header Content-Security-Policy "frame-ancestors 'none'" always;
		try_files $uri $uri/ /index.html;
	}
}

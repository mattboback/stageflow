version: "2"

run:
  timeout: 5m
  tests: true
  modules-download-mode: readonly
  go: "1.25"
  modules-from-go-work: true

issues:
  max-same-issues: 50

formatters:
  enable:
    - gofmt
    - goimports
    - golines
  settings:
    goimports:
      local-prefixes:
        - github.com/mattboback/stageflow
    golines:
      max-len: 120

linters:
  default: none
  enable:
    # --- correctness / bugs ---
    - errcheck
    - govet
    - staticcheck
    - unused
    - ineffassign
    - errorlint
    - nilerr
    - nilnil
    - copyloopvar
    - bodyclose
    - rowserrcheck
    - sqlclosecheck
    - noctx
    - durationcheck
    - exhaustive
    - intrange
    - unconvert
    - unparam

    # --- security / supply-chain / unicode footguns ---
    - gosec
    - asciicheck
    - bidichk
    - canonicalheader
    - depguard

    # --- quality / maintainability ---
    - gocritic
    - revive
    - misspell
    - nolintlint
    - predeclared
    - whitespace
    - wsl_v5
    - godot
    - nakedret
    - gocyclo
    - gocognit
    - nestif
    - goconst
    - dupl
    - perfsprint
    - makezero
    - usestdlibvars

    # --- tests ---
    - testifylint
    - thelper
    - tparallel

  settings:
    errcheck:
      check-type-assertions: true
      check-blank: true
      exclude-functions:
        - io.Copy(*bytes.Buffer)
        - io.Copy(os.Stdout)

    govet:
      enable-all: true
      disable:
        - fieldalignment
      settings:
        shadow:
          strict: true

    copyloopvar:
      check-alias: true

    gocyclo:
      min-complexity: 15

    gocognit:
      min-complexity: 20

    dupl:
      threshold: 150

    goconst:
      min-len: 3
      min-occurrences: 3

    misspell:
      locale: US

    perfsprint:
      strconcat: false

    rowserrcheck:
      packages:
        - github.com/jmoiron/sqlx

    depguard:
      rules:
        main:
          files:
            - "$all"
          deny:
            - pkg: "io/ioutil"
              desc: "io/ioutil is deprecated; use io or os"
            - pkg: "github.com/golang/protobuf"
              desc: "Use google.golang.org/protobuf instead"
            - pkg: "github.com/satori/go.uuid"
              desc: "Use github.com/google/uuid instead"
            - pkg: "github.com/gofrs/uuid$"
              desc: "Use github.com/gofrs/uuid/v5 or later"
        non-test-files:
          files:
            - "!$test"
          deny:
            - pkg: "math/rand$"
              desc: "Use math/rand/v2 instead"

    gosec:
      severity: medium
      confidence: medium
      excludes:
        - G104
        - G304

    revive:
      severity: warning
      confidence: 0.8
      rules:
        - name: exported
          severity: warning
          disabled: false
        - name: package-comments
          severity: warning
          disabled: false
        - name: unexported-return
          severity: warning
          disabled: false
        - name: blank-imports
          severity: warning
        - name: context-as-argument
          severity: error
        - name: context-keys-type
          severity: warning
        - name: dot-imports
          severity: warning
        - name: error-return
          severity: warning
        - name: error-strings
          severity: warning
        - name: error-naming
          severity: warning
        - name: increment-decrement
          severity: warning
        - name: var-naming
          severity: warning
          disabled: true
        - name: var-declaration
          severity: warning
        - name: range
          severity: warning
        - name: receiver-naming
          severity: warning
        - name: time-naming
          severity: warning
        - name: indent-error-flow
          severity: warning
        - name: errorf
          severity: warning
        - name: empty-block
          severity: warning
        - name: superfluous-else
          severity: warning
        - name: unused-parameter
          severity: warning
        - name: unreachable-code
          severity: warning
        - name: redefines-builtin-id
          severity: warning

    nolintlint:
      allow-no-explanation: [dupl, gocognit, gocyclo, golines]
      require-explanation: true
      require-specific: true

    nakedret:
      max-func-lines: 30

    testifylint:
      enable-all: true

  exclusions:
    warn-unused: true
    presets:
      - comments
      - std-error-handling
      - common-false-positives
    rules:
      - source: "TODO"
        linters: [godot]

      - text: "should have a package comment"
        linters: [revive]

      - text: 'exported \S+ \S+ should have comment( \(or a comment on this block\))? or be unexported'
        linters: [revive]

      - text: 'package comment should be of the form ".+"'
        source: "// ?(nolint|TODO)"
        linters: [revive]

      - text: 'comment on exported \S+ \S+ should be of the form ".+"'
        source: "// ?(nolint|TODO)"
        linters: [revive, staticcheck]

      - path: "_test\\.go"
        linters:
          - bodyclose
          - dupl
          - errcheck
          - goconst
          - gosec
          - noctx
          - sqlclosecheck

output:
  sort-results: true
  formats:
    text:
      path: stdout
      colors: true
      print-issued-lines: true
      print-linter-name: true
  sort-order:
    - linter
    - severity
    - file

severity:
  default: warning
  rules:
    - linters: [errcheck, govet, staticcheck, gosec, depguard, bodyclose, sqlclosecheck]
      severity: error

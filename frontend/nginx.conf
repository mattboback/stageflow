worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/json application/xml;

    server {
        listen 3000;
        listen [::]:3000;
        server_name _;

        root /usr/share/nginx/html;
        index index.html;

        # Allow large file uploads for A11Y scanner (up to 100MB)
        client_max_body_size 100M;

        location /api/ {
            proxy_pass http://portfolio-gateway:4000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header Connection "";

            # Proxy timeouts for long-running scans
            proxy_connect_timeout 600s;
            proxy_send_timeout 600s;
            proxy_read_timeout 600s;
        }

        # Static assets with long cache (SvelteKit uses _app for immutable assets)
        location ~* ^/_app/.*\.(js|css|woff2|woff|ttf|eot)$ {
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            try_files $uri =404;
        }

        # Other static assets with long cache
        location ~* \.(js|css|woff2|woff|ttf|eot)$ {
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            try_files $uri =404;
        }

        # Images with long cache
        location ~* \.(jpg|jpeg|png|gif|ico|svg|webp)$ {
            add_header Cache-Control "public, max-age=31536000" always;
            try_files $uri =404;
        }

        # SPA fallback - serve 200.html for all routes (SvelteKit adapter-static fallback)
        location / {
            add_header Cache-Control "public, max-age=0, must-revalidate" always;
            try_files $uri $uri/ /200.html;
        }

        location = /favicon.ico { access_log off; log_not_found off; }
        location = /robots.txt  { access_log off; log_not_found off; }
    }
}
